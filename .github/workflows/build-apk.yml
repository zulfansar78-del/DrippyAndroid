name: Build VibeLink APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17 (required by Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android || echo "Android platform already present"

      - name: Sync Capacitor (copies www -> android)
        run: npx cap sync android

      - name: Patch AndroidManifest with required permissions
        run: node scripts/patch-manifest.js

      - name: Install rsvg-convert (SVG → PNG)
        run: sudo apt-get install -y librsvg2-bin

      - name: Generate VibeLink launcher icons
        run: |
          for entry in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${entry%%:*}"; size="${entry##*:}"
            dir="android/app/src/main/res/mipmap-${density}"
            mkdir -p "$dir"
            rsvg-convert -w "$size" -h "$size" www/icon.svg -o "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done
          # Remove Capacitor's adaptive-icon directory entirely so the old vector
          # foreground can never override our PNGs on Android 8+ devices.
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibelink-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
